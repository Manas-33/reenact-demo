# Gates pull requests with Reenact - one job per agent (a matrix), so a PR that
# breaks one agent shows that agent's check red while the others stay green.
#
# The refund agent gates on assertions only (offline, no key). The support and analyst
# agents also run a model-judged criterion (reply_grounded / answer_grounded), so their
# entries install the Anthropic SDK (reenact[anthropic]) and pass ANTHROPIC_API_KEY from
# a repo secret. The `name` input scopes each gate's PR comment + check-run so they do
# not clobber: refund keeps the default "Reenact" check; support posts "Reenact
# (support)"; analyst posts "Reenact (analyst)".
name: Reenact
on: pull_request

permissions:
  contents: read
  pull-requests: write  # post/update the PR comment
  checks: write         # open the check-run

jobs:
  gate:
    name: gate (${{ matrix.agent }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: refund
            gate-name: ""
            suite: refund_agent/evals/suite.toml
            baseline: refund_agent/evals/baseline.json
            version: "reenact"
          - agent: support
            gate-name: support
            suite: support_agent/evals/suite.toml
            baseline: support_agent/evals/baseline.json
            version: "reenact[anthropic]"
          - agent: analyst
            gate-name: analyst
            suite: analyst_agent/evals/suite.toml
            baseline: analyst_agent/evals/baseline.json
            version: "reenact[anthropic]"
    steps:
      - uses: actions/checkout@v4
      - uses: Manas-33/Reenact/action@v0.1.0
        with:
          suite: ${{ matrix.suite }}
          baseline: ${{ matrix.baseline }}
          version: ${{ matrix.version }}
          token: ${{ github.token }}
          # The refund gate ignores this (no criterion, no anthropic installed); the
          # support gate needs it for the reply_grounded criterion. `secrets` is not
          # allowed in `strategy.matrix`, so it is referenced here in the step instead.
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          name: ${{ matrix.gate-name }}
