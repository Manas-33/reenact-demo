[project]
name = "reenact-demo"
version = "0.0.0"
description = "Example LLM agents gated by reenact's regression tests."
requires-python = ">=3.12"
dependencies = [
    "reenact",
    # The support agent is a LangGraph/RAG agent; its graph + keyless test need these.
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
# Only needed to record scenarios against the live API; the tests and the gate
# never need it. anthropic for the refund agent (SDK); langchain-anthropic for the
# support agent (LangGraph); openai for the analyst agent (SDK).
record = ["anthropic>=0.39", "langchain-anthropic>=0.2", "openai>=1.40"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One package per agent.
packages = ["refund_agent", "support_agent", "analyst_agent"]

[tool.uv.sources]
# During development, install reenact from the local checkout. Swap to the
# published package ("reenact" on PyPI) once it is released.
reenact = { path = "../Reenact/core", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
